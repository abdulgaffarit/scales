name: Refresh BLS OEWS Data

on:
  schedule:
    # OEWS is released each spring; check monthly and commit only when data changes
    - cron: '0 1 1 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/raw/*.zip'
  pull_request:
    paths:
      - 'scripts/fetch_oews.py'
      - 'data/job_soc.csv'
      - '.github/workflows/refresh-bls-data.yml'

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install openpyxl

      - name: Fetch OEWS national + state data
        env:
          # Optional: an email for the User-Agent, which bls.gov asks scripted clients to send
          BLS_CONTACT: ${{ secrets.BLS_CONTACT }}
        run: python scripts/fetch_oews.py

      - name: Commit updated data
        run: |
          [ -f data/state_wages.csv ] || { echo "No data fetched"; exit 0; }
          git add data/national_wages.csv data/state_wages.csv data/oews_meta.json
          if git diff --cached --quiet -- data/national_wages.csv data/state_wages.csv; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh BLS OEWS national and state wage data"
          git push

      - name: Deploy with new data
        # Pushes made with GITHUB_TOKEN don't trigger other workflows; dispatch explicitly
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
