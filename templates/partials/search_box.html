<div class="search{{ ' search-xl' if search_xl else '' }}" data-search>
  <form action="/salary/" method="get" role="search" aria-label="Search salaries">
    <label class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="sr">Search salaries by job, or by job and state</span>
      <input type="search" name="q" role="combobox" aria-autocomplete="list" aria-expanded="false" autocomplete="off" spellcheck="false" enterkeyhint="go" placeholder="{{ search_placeholder or 'Search a job, or a job and a state' }}">
      {% if not search_xl %}<span class="kbd" aria-hidden="true">/</span>{% endif %}
    </label>
  </form>
  <div class="search-list" role="listbox" aria-label="Search results" hidden></div>
  <p class="sr" role="status" aria-live="polite"></p>
</div>
